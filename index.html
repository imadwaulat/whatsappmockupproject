<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Mockup — XL Smart</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    text-align: center;
  }
  .logo {
    width: 64px;
    height: 64px;
    background: #25D366;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 32px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    color: #111;
    margin-bottom: 6px;
  }
  p {
    font-size: 14px;
    color: #888;
    margin-bottom: 28px;
  }
  .card {
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 12px;
    text-decoration: none;
    display: block;
    text-align: left;
    transition: background 0.15s, border-color 0.15s;
  }
  .card:hover {
    background: #e8f5e9;
    border-color: #25D366;
  }
  .card-label {
    font-size: 11px;
    font-weight: 600;
    color: #25D366;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: #111;
  }
  .card-desc {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">💬</div>
  <h1>XL Smart — WA Mockup</h1>
  <p>Pilih tipe layanan untuk melihat simulasi WhatsApp</p>

  <a class="card" href="postpaid%20upfront%20aktif.html">
    <div class="card-label">Pascabayar</div>
    <div class="card-title">Postpaid Upfront — Status Aktif</div>
    <div class="card-desc">Simulasi layanan kartu pascabayar upfront aktif</div>
  </a>

  <a class="card" href="postpaid%20paylater%20aktif.html">
    <div class="card-label">Pascabayar</div>
    <div class="card-title">Postpaid Paylater — Status Aktif</div>
    <div class="card-desc">Simulasi layanan kartu pascabayar paylater aktif</div>
  </a>
</div>
</body>
</html>
